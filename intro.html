<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>mAIgicly - Quantum Space</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    
    body {
      background: #000000;
      color: #ffffff;
      font-family: system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
      min-height: 100vh;
      overflow: hidden;
    }
    
    .intro-hero {
      min-height: 100vh;
      display: grid;
      place-items: center;
      text-align: center;
      gap: 32px;
      padding: 48px 20px;
      max-width: 900px;
      margin: 0 auto;
      position: relative;
    }
    
    .intro-hero::before {
      content: '';
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
      background: radial-gradient(circle at center, rgba(125, 211, 252, 0.03) 0%, transparent 70%);
      pointer-events: none;
    }
    
    .title {
      font-size: clamp(2.5rem, 8vw, 4rem);
      font-weight: 300;
      letter-spacing: 0.05em;
      background: linear-gradient(135deg, #7dd3fc, #a78bfa);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
      margin-bottom: 1rem;
    }
    
    #introText {
      font-size: clamp(1.1rem, 3vw, 1.4rem);
      line-height: 1.6;
      max-width: 70ch;
      margin: 0 auto;
      min-height: 3.2em;
      color: #ffffff;
      font-weight: 300;
      letter-spacing: 0.02em;
    }
    
    @keyframes destiny-pulse {
      0%, 100% { box-shadow: 0 0 12px rgba(125,211,252,0.35), 0 0 28px rgba(167,139,250,0.2); transform: scale(1); }
      50% { box-shadow: 0 0 28px rgba(125,211,252,0.7), 0 0 60px rgba(167,139,250,0.45); transform: scale(1.04); }
    }

    #beginBtn {
      display: none;
      background: linear-gradient(135deg, #7dd3fc, #a78bfa);
      color: #000000;
      border: none;
      padding: 13px 26px;
      font-size: 0.9rem;
      font-weight: 600;
      border-radius: 10px;
      cursor: pointer;
      transition: all 0.3s ease;
      margin-top: 2rem;
      position: relative;
      overflow: hidden;
      animation: destiny-pulse 2s ease-in-out infinite;
    }
    
    #beginBtn:hover {
      transform: translateY(-2px) scale(1.06);
      box-shadow: 0 8px 32px rgba(125,211,252,0.55), 0 0 60px rgba(167,139,250,0.4);
      animation: none;
    }
    
    #beginBtn:active {
      transform: translateY(0) scale(0.98);
      animation: none;
    }
    
    .quantum-particles {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      pointer-events: none;
      z-index: -1;
    }
    
    .particle {
      position: absolute;
      width: 2px;
      height: 2px;
      background: #7dd3fc;
      border-radius: 50%;
      opacity: 0;
      animation: float 8s infinite ease-in-out;
    }
    
    @keyframes float {
      0%, 100% {
        opacity: 0;
        transform: translateY(100vh) scale(0);
      }
      50% {
        opacity: 0.6;
        transform: translateY(-20px) scale(1);
      }
    }
    
    @media (max-width: 768px) {
      .intro-hero {
        gap: 24px;
        padding: 32px 16px;
      }
      
      #introText {
        font-size: 1.1rem;
      }
    }
  </style>
</head>
<body>
  <div class="quantum-particles"></div>
  
  <div class="intro-hero">
    <h1 class="title">mAIgicly</h1>
    <div id="introText"></div>
    <button id="beginBtn">DESTINY</button>
  </div>

  <script src="/js/reset-system.js"></script>
  <script src="/js/analytics.js"></script>
  <script src="/js/forged-qbits-store.js"></script>
  <script src="/js/intro.js"></script>
  <script>
    // Add floating particles
    function createParticles() {
      const container = document.querySelector('.quantum-particles');
      const particleCount = 30;
      
      for (let i = 0; i < particleCount; i++) {
        const particle = document.createElement('div');
        particle.className = 'particle';
        particle.style.left = Math.random() * 100 + '%';
        particle.style.animationDelay = Math.random() * 8 + 's';
        particle.style.animationDuration = (6 + Math.random() * 4) + 's';
        container.appendChild(particle);
      }
    }
    
    document.addEventListener('DOMContentLoaded', createParticles);
  </script>
</body>
</html>
