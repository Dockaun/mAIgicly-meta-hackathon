<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>mAIgicly - The Complete Story</title>
  <style>
    body { 
      background: #000; 
      color: #fff; 
      font-family: system-ui, sans-serif; 
      display: grid; 
      place-items: center; 
      min-height: 100vh;
      margin: 0;
      padding: 20px;
    }
    .comic-container { 
      max-width: 1100px; 
      text-align: center; 
      padding: 20px;
      width: 100%;
    }
    h2 { 
      color: #7dd3fc; 
      margin-bottom: 10px; 
      font-weight: 300;
      font-size: 1.8rem;
      background: linear-gradient(135deg, #7dd3fc, #a78bfa);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
    }
    .spread-panel {
      display: inline-flex;
      gap: 0.5rem;
      justify-content: center;
      align-items: center;
      background: rgba(20, 24, 40, 0.6);
      padding: 1rem;
      border-radius: 12px;
      border: 2px solid #7dd3fc;
      box-shadow: 0 0 20px rgba(125, 211, 252, 0.4);
      margin-bottom: 20px;
      width: fit-content;
      max-width: 90vw;
    }
    .comic-page { 
      height: auto;
      max-height: 75vh;
      max-width: 45vw;
      object-fit: contain;
      border-radius: 8px;
    }
    .controls {
      display: flex;
      gap: 12px;
      justify-content: center;
      align-items: center;
      margin-top: 20px;
      flex-wrap: wrap;
    }
    button { 
      padding: 10px 20px; 
      background: #7dd3fc; 
      color: #000; 
      border: none; 
      border-radius: 8px; 
      cursor: pointer; 
      font-weight: bold; 
      font-size: 1rem; 
      transition: all 0.3s ease;
    }
    button:hover { 
      opacity: 0.8; 
      transform: translateY(-1px); 
    }
    button:disabled {
      opacity: 0.3;
      cursor: not-allowed;
      transform: none;
    }
    .page-info {
      color: #9aa3b2;
      font-size: 0.9rem;
      margin: 10px 0;
    }
    @media (max-width: 768px) {
      .spread-panel {
        flex-direction: column;
      }
      .comic-page {
        max-width: 90vw;
      }
    }
  </style>
  <link rel="stylesheet" href="/css/theme.css">
</head>
<body>
  <div class="comic-container">
    <h2 id="pageTitle">mAIgicly: The Complete Story</h2>
    <div class="page-info" id="pageInfo">Pages 1-2 of 52</div>
    <div class="spread-panel">
      <img id="comicPage1" class="comic-page" src="" alt="Comic Page 1">
      <img id="comicPage2" class="comic-page" src="" alt="Comic Page 2">
    </div>
    <div class="controls">
      <button id="prevBtn">← Previous</button>
      <button id="nextBtn">Next →</button>
      <button id="continueBtn">← Return to Resonance</button>
    </div>
  </div>
  <script>
    const TOTAL_PAGES = 52;
    let currentSpread = 1;

    function loadSpread(spreadNum) {
      const page1 = (spreadNum - 1) * 2 + 1;
      const page2 = page1 + 1;
      
      if (page1 < 1 || page1 > TOTAL_PAGES) return;
      
      currentSpread = spreadNum;
      
      const img1 = document.getElementById('comicPage1');
      img1.src = `/comic/mAIgicly October 9-${page1}.webp`;
      img1.style.display = 'block';
      
      const img2 = document.getElementById('comicPage2');
      if (page2 <= TOTAL_PAGES) {
        img2.src = `/comic/mAIgicly October 9-${page2}.webp`;
        img2.style.display = 'block';
      } else {
        img2.style.display = 'none';
      }
      
      const pageInfoText = page2 <= TOTAL_PAGES 
        ? `Pages ${page1}-${page2} of ${TOTAL_PAGES}`
        : `Page ${page1} of ${TOTAL_PAGES}`;
      document.getElementById('pageInfo').textContent = pageInfoText;
      
      document.getElementById('prevBtn').disabled = currentSpread <= 1;
      document.getElementById('nextBtn').disabled = page2 >= TOTAL_PAGES;
      
      updateURL();
    }

    function updateURL() {
      const startPage = (currentSpread - 1) * 2 + 1;
      const newURL = `${window.location.pathname}?page=${startPage}`;
      window.history.replaceState({}, '', newURL);
    }

    document.addEventListener('DOMContentLoaded', () => {
      const params = new URLSearchParams(window.location.search);
      const startPage = parseInt(params.get('page')) || 1;
      
      currentSpread = Math.ceil(startPage / 2);
      loadSpread(currentSpread);

      document.getElementById('prevBtn').addEventListener('click', () => {
        if (currentSpread > 1) loadSpread(currentSpread - 1);
      });

      document.getElementById('nextBtn').addEventListener('click', () => {
        const maxSpread = Math.ceil(TOTAL_PAGES / 2);
        if (currentSpread < maxSpread) loadSpread(currentSpread + 1);
      });

      document.getElementById('continueBtn').addEventListener('click', () => {
        window.location.href = '/resonance.html';
      });

      document.addEventListener('keydown', (e) => {
        if (e.key === 'ArrowLeft' && currentSpread > 1) {
          loadSpread(currentSpread - 1);
        } else if (e.key === 'ArrowRight') {
          const maxSpread = Math.ceil(TOTAL_PAGES / 2);
          if (currentSpread < maxSpread) loadSpread(currentSpread + 1);
        }
      });
    });
  </script>
</body>
</html>
