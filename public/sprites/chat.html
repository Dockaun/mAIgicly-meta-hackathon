<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Quantum Chat - mAIgicly</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    
    body {
      background: #000000;
      color: #ffffff;
      font-family: system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
      height: 100vh;
      overflow: hidden;
      display: flex;
      flex-direction: column;
    }
    
    .chat-header {
      background: linear-gradient(135deg, rgba(255,255,255,0.05), rgba(255,255,255,0.02));
      border-bottom: 1px solid rgba(255,255,255,0.1);
      padding: 0.75rem 1.5rem;
      display: flex;
      align-items: center;
      justify-content: space-between;
      backdrop-filter: blur(10px);
    }
    
    .qbit-info {
      display: flex;
      align-items: center;
      gap: 1rem;
    }
    
    .qbit-avatar {
      width: 60px;
      height: 60px;
      border-radius: 50%;
      background: var(--qbit-gradient);
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: bold;
      color: #000000;
      border: 2px solid var(--qbit-color);
      box-shadow: 0 0 15px var(--qbit-shadow);
      overflow: hidden;
      position: relative;
    }

    .qbit-video {
      width: 100%;
      height: 100%;
      object-fit: cover;
      border-radius: 50%;
    }
    
    .qbit-details h2 {
      color: var(--qbit-color);
      margin-bottom: 0.25rem;
    }
    
    .qbit-details p {
      color: #94a3b8;
      font-size: 0.9rem;
    }
    
    .nav-buttons {
      display: flex;
      gap: 0.5rem;
    }
    
    .nav-btn {
      background: rgba(255,255,255,0.1);
      border: 1px solid rgba(255,255,255,0.2);
      color: #ffffff;
      padding: 10px 18px;
      border-radius: 10px;
      cursor: pointer;
      transition: all 0.3s ease;
      text-decoration: none;
      font-size: 0.95rem;
      font-weight: 500;
    }
    
    .nav-btn:hover {
      background: rgba(255,255,255,0.2);
    }
    
    .chamber-btn {
      background: var(--qbit-gradient);
      color: #000000;
      font-weight: 600;
      border: 2px solid var(--qbit-color);
      box-shadow: 0 0 10px var(--qbit-shadow);
    }
    
    .chamber-btn:hover {
      transform: scale(1.05);
      box-shadow: 0 0 15px var(--qbit-shadow);
    }
    
    .chat-container {
      flex: 1;
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    .qbit-display {
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 1rem;
      background: rgba(255,255,255,0.02);
      border-bottom: 1px solid rgba(255,255,255,0.1);
    }

    .qbit-video-large {
      width: 384px;
      height: 288px;
      border-radius: 18px;
      background: transparent;
      display: flex;
      align-items: center;
      justify-content: center;
      border: none;
      box-shadow: 0 0 35px var(--qbit-shadow);
      overflow: hidden;
      position: relative;
    }

    .qbit-video-large::before {
      content: '';
      position: absolute;
      top: -2px;
      left: -2px;
      right: -2px;
      bottom: -2px;
      background: linear-gradient(45deg, 
        transparent 0%, 
        var(--qbit-color) 25%, 
        transparent 50%, 
        var(--qbit-color) 75%, 
        transparent 100%);
      border-radius: 22px;
      z-index: -1;
      opacity: 0.3;
      animation: shimmer 3s ease-in-out infinite;
    }

    @keyframes shimmer {
      0% { opacity: 0.1; }
      50% { opacity: 0.3; }
      100% { opacity: 0.1; }
    }

    .main-qbit-video {
      width: 100%;
      height: 100%;
      object-fit: cover;
      border-radius: 17px;
      mask: radial-gradient(ellipse 80% 70% at center, 
        black 40%, 
        rgba(0,0,0,0.8) 60%, 
        rgba(0,0,0,0.4) 80%, 
        transparent 100%);
      -webkit-mask: radial-gradient(ellipse 80% 70% at center, 
        black 40%, 
        rgba(0,0,0,0.8) 60%, 
        rgba(0,0,0,0.4) 80%, 
        transparent 100%);
    }
    
    .chat-messages {
      flex: 1;
      overflow-y: auto;
      display: flex;
      flex-direction: column;
      gap: 1rem;
      padding: 1rem;
      min-height: 300px;
    }
    
    .message {
      max-width: 80%;
      padding: 1rem 1.5rem;
      border-radius: 18px;
      line-height: 1.5;
    }
    
    .message.user {
      align-self: flex-end;
      background: linear-gradient(135deg, #374151, #4b5563);
      color: #ffffff;
      border-bottom-right-radius: 6px;
    }
    
    .message.qbit {
      align-self: flex-start;
      background: linear-gradient(135deg, var(--qbit-gradient));
      color: #000000;
      border-bottom-left-radius: 6px;
      border: 1px solid var(--qbit-color);
    }
    
    .message.system {
      align-self: center;
      background: rgba(255,255,255,0.05);
      color: #94a3b8;
      font-style: italic;
      max-width: 60%;
      text-align: center;
      border-radius: 12px;
      padding: 0.75rem 1rem;
    }
    
    .ai-line {
      background: linear-gradient(135deg, var(--qbit-gradient));
      color: #000000;
      border: 1px solid var(--qbit-color);
      padding: 1rem 1.5rem;
      border-radius: 18px;
      border-bottom-left-radius: 6px;
      line-height: 1.5;
      margin: 1rem;
      min-height: 2.5rem;
      display: block;
      visibility: visible;
      opacity: 1;
      width: calc(100% - 2rem);
      box-sizing: border-box;
    }
    
    .typing {
      align-self: flex-start;
      background: var(--qbit-gradient);
      color: #000000;
      padding: 1rem 1.5rem;
      border-radius: 18px 18px 18px 6px;
      border: 1px solid var(--qbit-color);
      opacity: 0.7;
    }
    
    .typing-dots {
      display: flex;
      gap: 4px;
    }
    
    .typing-dot {
      width: 8px;
      height: 8px;
      background: #000000;
      border-radius: 50%;
      animation: typing 1.4s infinite ease-in-out;
    }
    
    .typing-dot:nth-child(2) { animation-delay: 0.2s; }
    .typing-dot:nth-child(3) { animation-delay: 0.4s; }
    
    @keyframes typing {
      0%, 60%, 100% { opacity: 0.3; }
      30% { opacity: 1; }
    }
    
    .chat-input-container {
      background: linear-gradient(135deg, rgba(255,255,255,0.05), rgba(255,255,255,0.02));
      border-top: 1px solid rgba(255,255,255,0.1);
      padding: 1rem 1.5rem;
      display: flex;
      gap: 1rem;
      align-items: center;
      backdrop-filter: blur(10px);
    }
    
    .chat-input {
      flex: 1;
      background: rgba(255,255,255,0.1);
      border: 1px solid rgba(255,255,255,0.2);
      border-radius: 12px;
      padding: 16px 20px;
      color: #ffffff;
      font-size: 1rem;
      outline: none;
      transition: all 0.3s ease;
      resize: none;
      font-family: inherit;
      line-height: 1.5;
      min-height: 80px;
      max-height: 160px;
      overflow-y: auto;
    }
    
    .chat-input::placeholder {
      color: #94a3b8;
      opacity: 1;
      font-style: italic;
      line-height: 1.4;
    }
    
    .chat-input:focus {
      border-color: var(--qbit-color);
      box-shadow: 0 0 0 2px var(--qbit-shadow);
    }
    
    .send-btn {
      background: var(--qbit-gradient);
      border: none;
      color: #000000;
      padding: 12px 20px;
      border-radius: 12px;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.3s ease;
      font-size: 1rem;
    }
    
    .send-btn:hover {
      transform: scale(1.05);
      box-shadow: 0 4px 12px var(--qbit-shadow);
    }
    
    .send-btn:disabled {
      opacity: 0.5;
      cursor: not-allowed;
      transform: none;
    }
    
    /* Qbit-specific colors */
    .refrax {
      --qbit-color: #7dd3fc;
      --qbit-gradient: linear-gradient(135deg, #7dd3fc, #38bdf8);
      --qbit-shadow: rgba(125, 211, 252, 0.3);
    }
    
    .magnetica {
      --qbit-color: #ef4444;
      --qbit-gradient: linear-gradient(135deg, #ef4444, #dc2626);
      --qbit-shadow: rgba(239, 68, 68, 0.3);
    }
    
    .chrona {
      --qbit-color: #fbbf24;
      --qbit-gradient: linear-gradient(135deg, #fbbf24, #f59e0b);
      --qbit-shadow: rgba(251, 191, 36, 0.3);
    }
    
    .violetflicker {
      --qbit-color: #a78bfa;
      --qbit-gradient: linear-gradient(135deg, #a78bfa, #8b5cf6);
      --qbit-shadow: rgba(167, 139, 250, 0.3);
    }
    
    .quantum-bg {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      pointer-events: none;
      z-index: -1;
      background: radial-gradient(circle at 25% 25%, var(--qbit-shadow) 0%, transparent 40%);
    }
    
    /* Scrollbar styling */
    .chat-messages::-webkit-scrollbar {
      width: 6px;
    }
    
    .chat-messages::-webkit-scrollbar-track {
      background: rgba(255,255,255,0.1);
      border-radius: 3px;
    }
    
    .chat-messages::-webkit-scrollbar-thumb {
      background: var(--qbit-color);
      border-radius: 3px;
      opacity: 0.7;
    }
    
    @media (max-width: 768px) {
      .chat-header {
        padding: 0.75rem 1rem;
      }
      
      .qbit-avatar {
        width: 50px;
        height: 50px;
      }
      
      .message {
        max-width: 90%;
        padding: 0.875rem 1.25rem;
      }
      
      .chat-input-container {
        padding: 0.75rem 1rem;
      }
      
      .nav-buttons {
        flex-direction: column;
        gap: 0.25rem;
      }
      
      .nav-btn {
        font-size: 0.8rem;
        padding: 6px 12px;
      }
    }
  </style>
</head>
<body id="chatBody">
  <div class="quantum-bg"></div>
  
  <div class="chat-header">
    <div class="qbit-info">
      <div class="qbit-avatar" id="qbitAvatar"></div>
      <div class="qbit-details">
        <h2 id="qbitName">Loading...</h2>
        <p id="qbitDescription">Quantum Companion</p>
      </div>
    </div>
    <div class="nav-buttons">
      <button class="nav-btn chamber-btn" id="skipToChamberBtn">Enter Chamber →</button>
    </div>
  </div>
  
  <div class="chat-container">
    <!-- Large centered Qbit video -->
    <div class="qbit-display">
      <div class="qbit-video-large" id="qbitVideoLarge">
        <video class="main-qbit-video" id="mainQbitVideo" autoplay playsinline>
          <source id="mainVideoSource" src="" type="video/mp4">
        </video>
      </div>
    </div>
    
    <div class="chat-messages" id="chatMessages" style="display: none;">
    </div>
    
    <div class="chat-input-container">
      <textarea class="chat-input" id="chatInput" placeholder="What do you want to know?" rows="2"></textarea>
      <button class="send-btn" id="sendBtn">Send</button>
    </div>
  </div>
  
  <script src="/js/chat.js"></script>
</body>
</html>
